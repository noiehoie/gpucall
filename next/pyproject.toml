[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpucall"
version = "3.0.0.dev0"
description = "Deterministic, owner-controlled compute jobs"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.26,<5", "fastapi>=0.111,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
modal = ["modal==1.5.5"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
gpucall = "gpucall.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
